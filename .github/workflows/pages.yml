# Rebuilds both sites and publishes them to GitHub Pages (gh-pages branch) on every push:
# the boys' site at the root and the boys + girls site under /all/.
name: Deploy to GitHub Pages
on:
  push:
    branches: [claude/senior-yearbook-site-pre05v, main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - run: touch dist-static/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-static
          force_orphan: true
